project:
  type: book
  output-dir: _output

book:
  # DOST preliminary page 1 — the TITLE PAGE. The format requires the R&D title,
  # the names of the coordinator/leader, the implementing and funding agencies,
  # and the years of TR completion. Quarto renders this block as page 1; there is
  # no separate title-page chapter in REPORT.md.
  #
  # Replace every <angle-bracket> placeholder before your first real build.
  title: "<R&D PROJECT TITLE>"
  # A trailing backslash is a line break inside the block.
  subtitle: |
    <Program title, if the project belongs to a program>\
    \
    Annual Progress Report\
    Reporting period: <project year>\
    Years of TR completion: <years>
  author: |
    Project Leader: <Name>\
    \
    Implementing Agency\
    <Agency>\
    \
    Funding Agency\
    <Agency>
  date: last-modified
  date-format: "D MMMM YYYY"

  # Filenames are SLUGS DERIVED FROM THE HEADINGS by build.ps1 — do not invent
  # them. Add a chapter to REPORT.md, run .\build.ps1, and it will tell you the
  # filename it produced and fail until you list it here.
  #
  # That failure is the point: a chapter missing from this list is silently
  # omitted from the rendered document, with no other warning anywhere.
  chapters:
    # preliminary pages — rendered unnumbered.
    # The DOST "Table of contents" preliminary page is generated by Quarto
    # (toc: true below); do not hand-write one.
    - index.qmd
    - acknowledgment.qmd
    - abstract.qmd
    - list-of-tables-figures-and-illustrations.qmd
    - list-of-acronyms-and-abbreviations.qmd
    # text — DOST items 1, 2, 3, 4, 5a, 5b, 5c, 5d, then 6 and 7
    - introduction.qmd
    - review-of-literature.qmd
    - scientific-basis-and-theoretical-framework.qmd
    - methodology.qmd
    - discussion-of-results-and-findings.qmd
    - outputs-6ps.qmd
    - outcomes.qmd
    - potential-impacts-2is.qmd
    - summary-and-conclusion.qmd
    - recommendation-for-future-r-d-work.qmd
    # back matter — rendered unnumbered
    - references.qmd
    - appendices.qmd
    - terminal-audited-financial-report.qmd
    - list-of-personnel-involved.qmd
    - list-of-equipment.qmd
    - problems.qmd
    - raw-data.qmd
    - attachments.qmd

format:
  docx:
    toc: true
    toc-depth: 2
    number-sections: true
    # Arial 11 (the DOST general instruction) and the chapter page breaks both
    # come from this reference document, NOT from the Markdown. Regenerate it
    # with patch-reference-docx.py — see README.
    reference-doc: reference.docx
